name: Import site source
on:
  push:
    paths:
      - CELT-Site-source.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          unzip -o CELT-Site-source.zip
          rm CELT-Site-source.zip
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import CE Louvor na Terra site source"
          git push
